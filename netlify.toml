[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API Redirect to Unified Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side Single Page Application (SPA) Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
